<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <title>Juego de Pedrito</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="orientation-lock">
    <div>
      <p>Gira el dispositivo</p>
      <p class="small">Este juego se juega en vertical</p>
    </div>
  </div>

  <main id="stage">
    <canvas id="game" width="360" height="640" aria-label="Juego de Pedrito"></canvas>

    <button id="start-overlay" type="button">
      <span class="cake">🎂</span>
      <span class="birthday">¡Felicidades Pedrito!</span>
      <span class="small">toca para empezar</span>
    </button>

    <div id="debug-panel" hidden>
      <header>DEBUG</header>
      <label>
        Ir a pantalla
        <select id="debug-scene"></select>
      </label>
      <button id="debug-go" type="button">Ir</button>
      <label class="check">
        <input type="checkbox" id="debug-infinite" />
        Vidas infinitas
      </label>
      <label class="check">
        <input type="checkbox" id="debug-mute" />
        Silenciar
      </label>
    </div>
  </main>

  <!-- Carga de scripts con cache-busting: ?v=<timestamp> evita que el
       navegador o GitHub Pages sirvan versiones antiguas. async=false
       conserva el orden de ejecución (motor -> escenas -> bootstrap). -->
  <script>
    (function () {
      var v = Date.now();
      var srcs = [
        'js/engine/state.js',
        'js/engine/input.js',
        'js/engine/loop.js',
        'js/engine/stars.js',
        'js/engine/effects.js',
        'js/engine/faces.js',
        'js/engine/vehicles.js',
        'js/engine/characters.js',
        'js/engine/audio.js',
        'js/engine/debug.js',
        'js/scenes/intro.js',
        'js/scenes/narrative.js',
        'js/scenes/invaders.js',
        'js/scenes/racing.js',
        'js/scenes/compactor.js',
        'js/scenes/lightsaber.js',
        'js/scenes/victory.js',
        'js/scenes/defeat.js',
        'js/main.js',
      ];
      srcs.forEach(function (src) {
        var s = document.createElement('script');
        s.src = src + '?v=' + v;
        s.async = false;
        document.head.appendChild(s);
      });
    })();
  </script>
</body>
</html>
